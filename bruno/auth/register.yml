info:
  name: register
  type: http
  seq: 2

http:
  method: POST
  url: "{{BASE_URL}}/auth/register"
  body:
    type: json
    data: |-
      {
        "name": "Test User",
        "email": "test@mail.com",
        "password": "12345678",
        "passwordRepeat": "12345678"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
