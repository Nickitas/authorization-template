info:
  name: login
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "test@mail.com",
        "password": "test_Pass"
      }
  auth: inherit

runtime:
  variables:
    - name: BASE_URL
      value: http://localhost:4000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
